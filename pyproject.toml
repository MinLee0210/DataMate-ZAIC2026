[project]
name = "datamate"
version = "0.1.0"
description = "DataMate: Vietnamese QA over messy tabular data (Zalo AI Challenge 2026)"
readme = "README.md"
authors = [
    { name = "Le Duc Minh", email = "minh.leduc.0210@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "colorlog>=6.12.0",
    "duckdb>=2.0.0",
    "fastapi>=0.162.0",
    "fastapi-cli>=0.0.32",
    "langgraph>=1.2.17",
    "openai>=3.37.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "sqlglot>=30.24.0",
]

[project.optional-dependencies]
datagen = [
    "deepagents>=0.7.32",
    "langchain-openai>=1.7.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B024"]  # BaseModules is intentionally abstract-but-empty for now

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
